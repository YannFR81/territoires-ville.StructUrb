[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structurb"
version = "0.1.0"
description = "Portage Python de Struct-Urb (dimensionnement des structures de chaussées urbaines, CERTU/CEREMA)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [
    { name = "YannFR81" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
